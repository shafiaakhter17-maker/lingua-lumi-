<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4e9e3">
<title>Lingua Lumi ✦</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --bg:#f8f1ed;
  --card:#fffaf7;
  --text:#493f45;
  --muted:#8d7f84;
  --accent:#9b7c91;
  --accent2:#d9b9ad;
  --line:#eaded9;
  --shadow:0 12px 35px rgba(100,75,75,.10);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  transition:.3s;
}

body.dark{
  --bg:#211d21;
  --card:#2d272c;
  --text:#f6eeee;
  --muted:#bcaeb4;
  --accent:#c6a8bd;
  --accent2:#8e6f80;
  --line:#443b41;
  --shadow:0 12px 35px rgba(0,0,0,.25);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* HEADER */

header{
  max-width:1180px;
  margin:auto;
  padding:24px 22px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-family:"Playfair Display",serif;
  font-size:25px;
  font-weight:600;
}

.logo span{
  color:var(--accent);
  font-size:18px;
}

#darkBtn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  width:43px;
  height:43px;
  border-radius:50%;
  box-shadow:var(--shadow);
}

/* HOME */

.home{
  max-width:1180px;
  margin:auto;
  padding:35px 22px 70px;
}

.hero{
  text-align:center;
  padding:40px 15px 28px;
}

.moon{
  font-size:38px;
  margin-bottom:12px;
}

.eyebrow{
  color:var(--accent);
  font-size:12px;
  letter-spacing:3px;
  font-weight:700;
}

h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(42px,8vw,76px);
  line-height:1;
  margin:15px 0;
  font-weight:500;
}

.hero p{
  max-width:560px;
  margin:0 auto;
  color:var(--muted);
  line-height:1.8;
  font-size:15px;
}

/* SEARCH */

.search-wrap{
  max-width:570px;
  margin:20px auto 30px;
  position:relative;
}

.search-wrap input{
  width:100%;
  padding:17px 22px;
  border-radius:50px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  outline:none;
  box-shadow:var(--shadow);
}

.search-wrap input:focus{
  border-color:var(--accent);
}

/* LANGUAGES */

.languages{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  margin:10px auto 45px;
}

.lang{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:9px 14px;
  border-radius:30px;
  transition:.2s;
}

.lang:hover,
.lang.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
  transform:translateY(-2px);
}

/* STORIES */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:20px;
}

.section-title h2{
  font-family:"Playfair Display",serif;
  font-size:31px;
  margin:0;
}

.section-title span{
  color:var(--muted);
  font-size:13px;
}

.story-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.story-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:25px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .25s,box-shadow .25s;
  cursor:pointer;
}

.story-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 45px rgba(100,75,75,.16);
}

.story-art{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
}

.art1{background:#eadbd5}
.art2{background:#e1d8e4}
.art3{background:#e6dfc9}
.art4{background:#dbe2d5}
.art5{background:#d8dce7}
.art6{background:#e7d8d0}

.story-content{
  padding:22px;
}

.story-content small{
  color:var(--accent);
  font-size:11px;
  letter-spacing:1.5px;
  font-weight:700;
}

.story-content h3{
  font-family:"Playfair Display",serif;
  font-size:25px;
  margin:8px 0;
}

.story-content p{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  margin:0 0 17px;
}

.read-link{
  color:var(--accent);
  font-size:13px;
  font-weight:700;
}

/* READER */

.reader-page{
  min-height:100vh;
  padding-bottom:70px;
}

.reader-top{
  max-width:1000px;
  margin:auto;
  padding:22px;
}

.back{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:10px 17px;
  border-radius:30px;
}

.reader-art{
  max-width:1000px;
  height:280px;
  margin:10px auto 0;
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:105px;
}

.reader-card{
  max-width:820px;
  margin:-35px auto 0;
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:30px;
  padding:35px;
  box-shadow:var(--shadow);
}

.reader-card .label{
  color:var(--accent);
  font-size:11px;
  letter-spacing:2px;
  font-weight:700;
}

.reader-card h2{
  font-family:"Playfair Display",serif;
  font-size:42px;
  margin:10px 0 8px;
}

.reader-desc{
  color:var(--muted);
  margin-bottom:28px;
}

.story-text{
  font-family:"Playfair Display",serif;
  font-size:20px;
  line-height:2;
  white-space:pre-line;
}

.tools{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:30px 0;
}

.tool{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  padding:11px 16px;
  border-radius:25px;
}

.tool:hover{
  background:var(--accent);
  color:white;
}

.translation,
.vocab-box{
  margin-top:22px;
  padding:22px;
  border-radius:20px;
  background:rgba(155,124,145,.09);
  border:1px solid var(--line);
}

.translation h3,
.vocab-box h3{
  font-family:"Playfair Display",serif;
  margin-top:0;
}

.vocab-list{
  display:grid;
  gap:10px;
}

.vocab-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.vocab-item:last-child{
  border-bottom:0;
}

.word{
  font-weight:700;
}

.meaning{
  color:var(--muted);
  text-align:right;
}

/* EMPTY */

.empty{
  text-align:center;
  color:var(--muted);
  padding:45px;
}

/* TAP ANIMATION */

button:active,
.story-card:active{
  transform:scale(.97);
}

/* MOBILE */

@media(max-width:850px){
  .story-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  header{
    padding:18px 17px 5px;
  }

  .home{
    padding:20px 16px 55px;
  }

  .hero{
    padding-top:25px;
  }

  .story-grid{
    grid-template-columns:1fr;
  }

  .story-art{
    height:210px;
  }

  .reader-art{
    height:220px;
    margin:5px 15px 0;
  }

  .reader-card{
    margin:-25px 15px 0;
    padding:25px 20px;
  }

  .reader-card h2{
    font-size:34px;
  }

  .story-text{
    font-size:18px;
  }

  .vocab-item{
    flex-direction:column;
    gap:4px;
  }

  .meaning{
    text-align:left;
  }
}
</style>
</head>

<body>

<div id="homePage">

<header>
  <div class="logo">Lingua Lumi <span>✦</span></div>
  <button id="darkBtn">☾</button>
</header>

<main class="home">

<section class="hero">
  <div class="moon">☾</div>
  <div class="eyebrow">STORIES THAT TEACH · LANGUAGES THAT STAY</div>
  <h1>Little stories,<br>new languages ✦</h1>
  <p>
    A cozy little corner where you can discover gentle stories,
    learn new words and explore languages at your own pace.
  </p>
</section>

<div class="search-wrap">
  <input id="search" type="search" placeholder="Search a story...">
</div>

<div class="languages" id="languages"></div>

<div class="section-title">
  <h2>Little stories</h2>
  <span id="storyCount"></span>
</div>

<div class="story-grid" id="storyGrid"></div>

</main>
</div>


<div id="readerPage" class="reader-page hidden">

  <div class="reader-top">
    <button class="back" id="backBtn">← Back to stories</button>
  </div>

  <div class="reader-art" id="readerArt"></div>

  <article class="reader-card">

    <div class="label" id="readerLabel">A LITTLE STORY</div>
    <h2 id="readerTitle"></h2>
    <div class="reader-desc" id="readerDesc"></div>

    <div class="story-text" id="storyText"></div>

    <div class="tools">
      <button class="tool" id="speakBtn">🔊 Read aloud</button>
      <button class="tool" id="translateBtn">🌿 English translation</button>
    </div>

    <div class="translation hidden" id="translationBox">
      <h3>English translation</h3>
      <div id="translationText"></div>
    </div>

    <div class="vocab-box">
      <h3>Words to keep ✦</h3>
      <div class="vocab-list" id="vocabList"></div>
    </div>

  </article>
</div>

let currentLanguage = "en";

/* STORY DATA */

const stories = [

{
title:"The Little Umbrella",
icon:"☂️",
art:"art1",

desc:{
en:"A tiny umbrella learns that even small things can make someone feel safe.",
hi:"एक छोटी छतरी सीखती है कि छोटी चीज़ें भी किसी को सुरक्षित महसूस करा सकती हैं।",
ja:"小さな傘は、小さなものでも誰かを安心させられると学びます。",
ko:"작은 우산은 작은 것들도 누군가를 편안하게 해줄 수 있다는 것을 배웁니다.",
es:"Un pequeño paraguas descubre que incluso las cosas pequeñas pueden hacer sentir seguro a alguien.",
fr:"Un petit parapluie découvre que même les petites choses peuvent rassurer quelqu'un.",
de:"Ein kleiner Regenschirm lernt, dass auch kleine Dinge jemandem Sicherheit geben können.",
it:"Un piccolo ombrello scopre che anche le piccole cose possono far sentire qualcuno al sicuro.",
ar:"تتعلم مظلة صغيرة أن الأشياء الصغيرة يمكن أن تجعل شخصًا يشعر بالأمان."
},

text:{
en:`The rain began quietly.

Mina was walking home when she noticed a little umbrella lying beside a bench. It was old, with a tiny tear near one corner.

She picked it up and carried it with her.

A few steps later, she saw a small bird sitting beneath a tree. The bird was wet and shivering.

Mina opened the little umbrella above it.

The umbrella was not big enough to cover everything, but it was enough.

The bird stopped shaking.

Mina smiled.

Sometimes, she thought, being helpful does not mean doing something huge. Sometimes it simply means making a little space for someone else.`,

hi:`बारिश धीरे-धीरे शुरू हुई।

मीना घर जा रही थी तभी उसे एक बेंच के पास एक छोटी छतरी दिखाई दी। वह पुरानी थी और उसके एक कोने में छोटा सा छेद था।

मीना ने उसे उठा लिया।

थोड़ी दूर जाने पर उसने एक छोटे पक्षी को पेड़ के नीचे बैठे देखा। पक्षी भीगा हुआ था और काँप रहा था।

मीना ने छोटी छतरी उसके ऊपर खोल दी।

छतरी इतनी बड़ी नहीं थी कि सब कुछ ढक सके, लेकिन वह पर्याप्त थी।

पक्षी ने काँपना बंद कर दिया।

मीना मुस्कुराई।

कभी-कभी किसी की मदद करने के लिए बहुत बड़ा काम करना ज़रूरी नहीं होता। कभी-कभी बस किसी के लिए थोड़ी सी जगह बनाना ही काफी होता है।`,

ja:`雨が静かに降り始めました。

ミナは家へ帰る途中、ベンチのそばに小さな傘が落ちているのを見つけました。傘は古く、端に小さな破れがありました。

ミナは傘を拾いました。

少し歩くと、木の下に小さな鳥がいました。鳥は濡れて震えていました。

ミナはその鳥の上で小さな傘を開きました。

傘はすべてを覆えるほど大きくありませんでした。でも、それで十分でした。

鳥は震えるのをやめました。

ミナは微笑みました。

誰かを助けることは、いつも大きなことをすることではありません。時には、誰かのために少しだけ場所を作ることなのです。`,

ko:`비가 조용히 내리기 시작했습니다.

미나는 집으로 가다가 벤치 옆에 놓인 작은 우산을 발견했습니다. 우산은 낡았고 한쪽에 작은 구멍이 있었습니다.

미나는 우산을 주웠습니다.

조금 걷자 나무 아래에서 작은 새 한 마리를 발견했습니다. 새는 비에 젖어 떨고 있었습니다.

미나는 작은 우산을 새 위에 펼쳤습니다.

우산은 모든 것을 덮을 만큼 크지 않았지만 충분했습니다.

새는 떨음을 멈췄습니다.

미나는 미소를 지었습니다.

누군가를 돕는 것이 항상 큰 일을 의미하는 것은 아닙니다. 때로는 다른 사람을 위해 작은 공간을 만들어 주는 것만으로도 충분합니다.`,

es:`La lluvia comenzó suavemente.

Mina caminaba a casa cuando vio un pequeño paraguas junto a un banco. Era viejo y tenía un pequeño agujero en una esquina.

Lo recogió y siguió caminando.

Un poco después vio un pequeño pájaro debajo de un árbol. Estaba mojado y temblaba.

Mina abrió el pequeño paraguas sobre él.

No era lo bastante grande para cubrirlo todo, pero era suficiente.

El pájaro dejó de temblar.

Mina sonrió.

A veces, ayudar no significa hacer algo enorme. A veces simplemente significa hacer un pequeño espacio para alguien más.`,

fr:`La pluie commença doucement.

Mina rentrait chez elle lorsqu'elle remarqua un petit parapluie près d'un banc. Il était vieux et avait un petit trou dans un coin.

Elle le ramassa.

Quelques pas plus loin, elle vit un petit oiseau sous un arbre. Il était mouillé et tremblait.

Mina ouvrit le petit parapluie au-dessus de lui.

Il n'était pas assez grand pour tout couvrir, mais c'était suffisant.

L'oiseau arrêta de trembler.

Mina sourit.

Parfois, aider ne signifie pas faire quelque chose d'énorme. Parfois, il suffit simplement de faire un peu de place pour quelqu'un d'autre.`,

de:`Der Regen begann leise.

Mina ging nach Hause, als sie neben einer Bank einen kleinen Regenschirm bemerkte. Er war alt und hatte an einer Ecke ein kleines Loch.

Sie hob ihn auf.

Ein paar Schritte später sah sie einen kleinen Vogel unter einem Baum. Er war nass und zitterte.

Mina hielt den kleinen Regenschirm über ihn.

Der Schirm war nicht groß genug, um alles abzudecken, aber er war groß genug.

Der Vogel hörte auf zu zittern.

Mina lächelte.

Manchmal bedeutet Helfen nicht, etwas Großes zu tun. Manchmal reicht es, ein wenig Platz für jemand anderen zu schaffen.`,

it:`La pioggia iniziò piano.

Mina stava tornando a casa quando notò un piccolo ombrello accanto a una panchina. Era vecchio e aveva un piccolo strappo in un angolo.

Lo raccolse.

Poco dopo vide un piccolo uccello sotto un albero. Era bagnato e tremava.

Mina aprì il piccolo ombrello sopra di lui.

Non era abbastanza grande per coprire tutto, ma era sufficiente.

L'uccello smise di tremare.

Mina sorrise.

A volte aiutare non significa fare qualcosa di enorme. A volte significa semplicemente creare un piccolo spazio per qualcun altro.`,

ar:`بدأ المطر بهدوء.

كانت مينا في طريقها إلى المنزل عندما لاحظت مظلة صغيرة بجانب مقعد. كانت قديمة وبها تمزق صغير في أحد أطرافها.

حملتها ومشت بها.

بعد خطوات قليلة رأت طائرًا صغيرًا تحت شجرة. كان مبتلًا ويرتجف.

فتحت مينا المظلة الصغيرة فوقه.

لم تكن المظلة كبيرة بما يكفي لتغطي كل شيء، لكنها كانت كافية.

توقف الطائر عن الارتجاف.

ابتسمت مينا.

أحيانًا، لا تعني مساعدة الآخرين القيام بشيء ضخم. أحيانًا يكفي أن نصنع مساحة صغيرة لشخص آخر.`

ko:"조용한 아침은 따뜻한 한 잔과 약간의 인내로 시작됩니다.",
es:"Una mañana tranquila comienza con una taza caliente y un poco de paciencia.",
fr:"Une matinée calme commence avec une tasse chaude et un peu de patience.",
de:"Ein ruhiger Morgen beginnt mit einer warmen Tasse und etwas Geduld.",
it:"Una mattina tranquilla inizia con una tazza calda e un po' di pazienza.",

text:{
en:`The morning arrived slowly.

Nora sat beside the window with a warm cup of tea. Outside, the street was still quiet.

She had many things to do, but she decided not to hurry.

She watched the sunlight move across the table.

One sip.

One breath.

One small thought at a time.

By the time her tea was finished, the day no longer felt so heavy.

Nothing outside had changed.

But something inside her had.

She had remembered that a day does not have to begin with a race.`,

hi:`सुबह धीरे-धीरे आई।

नोरा खिड़की के पास गर्म चाय का कप लेकर बैठी थी। बाहर सड़क अभी शांत थी।

उसके पास करने के लिए बहुत काम थे, लेकिन उसने जल्दी न करने का फैसला किया।

उसने सूरज की रोशनी को मेज़ पर धीरे-धीरे चलते देखा।

एक घूंट।

एक साँस।

एक छोटा विचार।

जब तक उसकी चाय खत्म हुई, दिन इतना भारी नहीं लग रहा था।

बाहर कुछ नहीं बदला था।

लेकिन उसके अंदर कुछ बदल गया था।

उसे याद आया कि दिन की शुरुआत हमेशा दौड़ से नहीं करनी होती।`,

ja:`朝がゆっくりとやってきました。

ノラは窓のそばで温かいお茶を飲んでいました。外の通りはまだ静かでした。

やることはたくさんありましたが、急がないことにしました。

テーブルの上を動く朝の光を眺めました。

一口。

一息。

一つの小さな考え。

お茶を飲み終えるころ、今日はもうそれほど重く感じませんでした。

外の何も変わっていません。

でも、彼女の中では何かが変わっていました。

一日は競争のように始めなくてもいいのだと、思い出したのです。`,

ko:`아침이 천천히 찾아왔습니다.

노라는 창가에 앉아 따뜻한 차 한 잔을 마셨습니다. 밖의 거리는 아직 조용했습니다.

해야 할 일은 많았지만 서두르지 않기로 했습니다.

그녀는 햇빛이 테이블 위를 천천히 움직이는 것을 바라보았습니다.

한 모금.

한 번의 숨.

한 가지 작은 생각.

차를 다 마셨을 때 하루가 더 이상 그렇게 무겁게 느껴지지 않았습니다.

밖의 아무것도 변하지 않았습니다.

하지만 그녀의 마음속 무언가는 변했습니다.

하루를 항상 서두르며 시작할 필요는 없다는 것을 기억한 것입니다.`,

es:`La mañana llegó lentamente.

Nora se sentó junto a la ventana con una taza de té caliente. Afuera, la calle todavía estaba tranquila.

Tenía muchas cosas que hacer, pero decidió no apresurarse.

Observó cómo la luz del sol cruzaba la mesa.

Un sorbo.

Una respiración.

Un pequeño pensamiento a la vez.

Cuando terminó su té, el día ya no parecía tan pesado.

Nada había cambiado afuera.

Pero algo había cambiado dentro de ella.

Había recordado que un día no tiene que comenzar como una carrera.`,

fr:`Le matin arriva doucement.

Nora s'assit près de la fenêtre avec une tasse de thé chaud. Dehors, la rue était encore calme.

Elle avait beaucoup de choses à faire, mais elle décida de ne pas se presser.

Elle regarda la lumière du soleil traverser la table.

Une gorgée.

Une respiration.

Une petite pensée à la fois.

Lorsqu'elle termina son thé, la journée ne semblait plus aussi lourde.

Rien n'avait changé dehors.

Mais quelque chose avait changé en elle.

Elle s'était rappelé qu'une journée n'a pas besoin de commencer par une course.`,

de:`Der Morgen kam langsam.

Nora saß am Fenster mit einer warmen Tasse Tee. Draußen war die Straße noch ruhig.

Sie hatte viel zu tun, aber sie beschloss, sich nicht zu beeilen.

Sie beobachtete, wie das Sonnenlicht über den Tisch wanderte.

Ein Schluck.

Ein Atemzug.

Ein kleiner Gedanke nach dem anderen.

Als ihr Tee leer war, fühlte sich der Tag nicht mehr so schwer an.

Draußen hatte sich nichts verändert.

Aber in ihr hatte sich etwas verändert.

Sie erinnerte sich daran, dass ein Tag nicht wie ein Wettlauf beginnen muss.`,

it:`La mattina arrivò lentamente.

Nora si sedette vicino alla finestra con una tazza di tè caldo. Fuori, la strada era ancora tranquilla.

Aveva molte cose da fare, ma decise di non avere fretta.

Guardò la luce del sole attraversare il tavolo.

Un sorso.

Un respiro.

Un piccolo pensiero alla volta.

Quando finì il tè, la giornata non sembrava più così pesante.

Fuori non era cambiato nulla.

Ma dentro di lei qualcosa era cambiato.

Aveva ricordato che una giornata non deve iniziare come una gara.`,

ar:`جاء الصباح ببطء.

جلست نورا بجانب النافذة وهي تحمل كوبًا دافئًا من الشاي. كان الشارع في الخارج هادئًا.

كان لديها الكثير من الأشياء لتفعلها، لكنها قررت ألا تتسرع.

راقبت ضوء الشمس وهو يتحرك فوق الطاولة.

رشفة واحدة.

نفس واحد.

فكرة صغيرة في كل مرة.
